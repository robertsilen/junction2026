<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MariaDB Booth</title>
<!--
  Booth screen loop for Junction 2026. Open in a browser, press F for full screen.
  Built by build.py from template.html, script.md and the logo files; index.html needs no network.

  Logos: MariaDB Server's official SVG (github.com/MariaDB/.github, CC BY-SA 4.0), and
  Wikipedia's globe and wordmark from Wikimedia Commons (trademarks of the Wikimedia Foundation).
  Only their entrance is animated; at rest each is the file as published.
-->
<style>
  :root { --bg: #0b0d14; --coral: #D1876C; --blue: #6183E0; --text: #ffffff; --dim: #9aa3b8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
               font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; }
  body.idle { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* Always at the top: the two logos, and the title under them */
  #top { position: fixed; top: 5vh; left: 0; right: 0; display: flex; flex-direction: column;
         align-items: center; gap: 3vh; }
  #top .logos { display: flex; justify-content: center; align-items: center; gap: 3.5vw; }
  #top .wp { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
  #top .globe { height: 17vh; }
  #top .word { height: 3vh; filter: invert(1); }            /* the black wordmark, white on dark */
  #top .bar { width: 2px; height: 16vh; background: var(--dim); opacity: .4; }
  #top .mdb { width: 24vw; }
  #top em { font-style: normal; color: var(--coral); }
  #top .title { font-size: clamp(26px, 4.2vw, 100px); font-weight: 600; letter-spacing: -.01em; }
  #top .wp, #top .bar, #top .mdb, #top .title { opacity: 0; }

  /* The slogans, one at a time */
  #slogan { position: fixed; left: 4vw; right: 4vw; top: 45vh; height: 44vh; display: flex;
            flex-direction: column; justify-content: center; text-align: center; }
  #slogan .big { font-size: clamp(32px, 6.6vw, 150px); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
  #slogan .small { margin-top: 3vh; font-size: clamp(18px, 2.9vw, 68px); color: var(--dim); }
  #slogan em { font-style: normal; color: var(--coral); }
  #slogan .w { display: inline-block; white-space: pre; }



  /* Optional, from script.md "## QR code": a QR code in the top right corner, with a label */
  #qr { position: fixed; top: 4vh; right: 2.5vw; width: 15vw; display: flex; flex-direction: column;
        align-items: center; gap: 1.2vh; text-align: center; }
  #qr img { width: 100%; border-radius: .8vw; display: block; }
  #qr .label { font-size: clamp(14px, 1.6vw, 38px); font-weight: 600; }
  #qr .url { font-size: clamp(10px, .85vw, 20px); color: var(--dim); word-break: break-all; }

  @media (orientation: portrait) {
    #top .logos { flex-direction: column; gap: 2vh; }
    #top .bar { display: none; }
    #top .globe { height: auto; width: 30vw; }
    #top .word { height: auto; width: 30vw; }
    #top .mdb { width: 55vw; }
    #slogan { top: 58vh; height: 30vh; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="top">
  <div class="logos">
    <img class="mdb" src="%%MARIADB_IMG%%" alt="MariaDB Server">
    <div class="bar"></div>
    <div class="wp">
      <img class="globe" src="%%WP_GLOBE%%" alt="Wikipedia">
      <img class="word" src="%%WP_WORD%%" alt="">
    </div>
  </div>
  <div class="title">%%TITLE%%</div>
</div>

<div id="slogan"></div>
%%QR%%

<script>
const SLOGANS = %%SCRIPT%%;
const SECONDS = %%SECONDS%%;          // how long each slogan stays, from script.md
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const pop = "cubic-bezier(.2, 1.4, .4, 1)", glide = "cubic-bezier(.6, 0, .2, 1)";

// --- The top line comes in once, then stays; after a reload it is simply there ----------------
let reloaded = false;
try { reloaded = sessionStorage.getItem("shown") === "1"; sessionStorage.setItem("shown", "1"); } catch (e) {}
if (reloaded) {
  document.querySelectorAll("#top .wp, #top .mdb, #top .title").forEach(e => e.style.opacity = 1);
  $("#top .bar").style.opacity = .4;
} else {
  $("#top .wp").animate([{ opacity: 0, transform: "rotate(-30deg) scale(.6)" }, { opacity: 1, transform: "none" }],
    { duration: 1400, delay: 1400, easing: pop, fill: "forwards" });
  $("#top .bar").animate([{ opacity: 0, transform: "scaleY(0)" }, { opacity: .4, transform: "none" }],
    { duration: 800, delay: 1100, easing: glide, fill: "forwards" });
  $("#top .mdb").animate([{ opacity: 0, transform: "translateX(-5vw)" }, { opacity: 1, transform: "none" }],
    { duration: 1000, delay: 300, easing: pop, fill: "forwards" });
  $("#top .title").animate([{ opacity: 0, transform: "translateY(2vh)" }, { opacity: 1, transform: "none" }],
    { duration: 900, delay: 2100, easing: glide, fill: "forwards" });
}

// --- Slogans: each word rises into place, then the whole slogan lifts away ----------------------
function words(html) {
  // Wrap every word in a span, keeping <em> around the words it colours.
  const box = document.createElement("div");
  box.innerHTML = html;
  (function walk(node) {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const part of child.textContent.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.append(" "); continue; }
          const w = document.createElement("span");
          w.className = "w"; w.textContent = part;
          frag.append(w);
        }
        child.replaceWith(frag);
      } else walk(child);
    }
  })(box);
  return box.innerHTML;
}

async function slogans() {
  await wait(reloaded ? 500 : 3000);
  const el = $("#slogan");
  for (const s of SLOGANS) {
    el.innerHTML = `<div class="big">${words(s.big)}</div>` + (s.small ? `<div class="small">${s.small}</div>` : "");
    const ws = [...el.querySelectorAll(".big .w")];
    ws.forEach((w, i) => w.animate([
      { opacity: 0, transform: "translateY(0.6em) scale(.9)", filter: "blur(8px)" },
      { opacity: 1, transform: "none", filter: "blur(0)" }],
      { duration: 700, delay: i * 110, easing: pop, fill: "backwards" }));
    const small = el.querySelector(".small");
    if (small) small.animate([{ opacity: 0, transform: "translateY(1.5vh)" }, { opacity: 1, transform: "none" }],
      { duration: 800, delay: ws.length * 110 + 300, easing: glide, fill: "backwards" });
    await wait(ws.length * 110 + SECONDS * 1000);
    // No fill: once the fade is over the slogan is emptied, so the next one starts fully visible.
    await el.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-3vh)" }],
      { duration: 450, easing: glide }).finished;
    el.innerHTML = "";
  }
  // End of the loop: reload, to pick up a new version of the page. Only when the page can be
  // fetched, so a lost network keeps the loop going instead of showing an error page.
  try {
    if ((await fetch(location.href, { cache: "no-store" })).ok) return location.reload();
  } catch (e) {}
  slogans();
}
slogans();

// --- Background: drifting points, joined when near — a nod to vectors ---------------------------
const cv = $("#bg"), cx = cv.getContext("2d");
let W, H, pts;
function resize() {
  const d = devicePixelRatio;
  W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
  pts = Array.from({ length: Math.round(innerWidth * innerHeight / 26000) }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .25 * d, vy: (Math.random() - .5) * .25 * d,
    c: Math.random() < .5 ? "209,135,108" : "97,131,224" }));
}
function draw() {
  const d = devicePixelRatio, R = 150 * d;
  cx.clearRect(0, 0, W, H);
  for (const p of pts) {
    p.x = (p.x + p.vx + W) % W; p.y = (p.y + p.vy + H) % H;
    cx.fillStyle = `rgba(${p.c},.35)`;
    cx.beginPath(); cx.arc(p.x, p.y, 1.6 * d, 0, 7); cx.fill();
  }
  cx.lineWidth = d;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const a = pts[i], b = pts[j], dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (dist < R) {
      cx.strokeStyle = `rgba(${a.c},${.14 * (1 - dist / R)})`;
      cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
    }
  }
  requestAnimationFrame(draw);
}
addEventListener("resize", resize); resize(); draw();

// --- F for full screen; hide the cursor when it is still ----------------------------------------
addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F")
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
let idle;
addEventListener("mousemove", () => {
  document.body.classList.remove("idle"); clearTimeout(idle);
  idle = setTimeout(() => document.body.classList.add("idle"), 2000);
});
</script>
</body>
</html>
