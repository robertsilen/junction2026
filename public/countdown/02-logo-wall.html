<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MariaDB Logo Wall</title>
<script src="brand.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --copper:#c49a6c;
    --ink:#f5f7f8;
    --muted:rgba(245,247,248,.55);
    --faint:rgba(245,247,248,.38);
    --hair:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased}

  /* ---------- Quiet tilted wall ---------- */
  .scene{position:fixed;inset:0;perspective:120vmin;perspective-origin:50% 40%;overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%, #111013 0%, var(--bg) 70%)}
  .plane{position:absolute;left:50%;top:50%;width:260vmax;
    transform:translate(-50%,-50%) rotateX(36deg) rotateZ(-12deg);
    display:flex;flex-direction:column;gap:2.4vmin}
  .row{display:flex;width:max-content;gap:2.4vmin;will-change:transform}
  .row.l{animation:left var(--d,160s) linear infinite}
  .row.r{animation:right var(--d,160s) linear infinite}
  @keyframes left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes right{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  .tile{flex:none;width:12vmin;height:12vmin;border-radius:2.6vmin;display:grid;place-items:center;
    background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.03)}
  .tile svg{width:56%;height:56%;fill:#fff;opacity:.13}
  .tile.wiki svg{opacity:.1}

  .shade{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 58% 56% at 50% 50%, rgba(7,12,15,.92) 0%, rgba(7,12,15,.6) 55%, transparent 100%),
      radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(3,6,8,.85) 100%)}

</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-seal" viewBox="-20 -14 246 259"></symbol>
    <symbol id="i-wiki" viewBox="0 0 24 24"><path data-icon="wiki"/></symbol>
  </svg>

  <div class="scene"><div class="plane" id="plane"></div></div>
  <div class="shade"></div>


<script>
/* ================= EDIT ME ================= */
const CONFIG = {
  rows: 11,              // rows on the logo wall
  tilesPerRow: 18,       // unique tiles per row (duplicated for the seamless loop)
};
/* =========================================== */

const ICONS = {

};
document.querySelectorAll('[data-icon]').forEach(p => p.setAttribute('d', ICONS[p.dataset.icon]));
document.getElementById('i-seal').innerHTML = BRAND.svgMark().replace(/^<svg[^>]*>|<\/svg>$/g, '');

/* ---------- Build the quiet logo wall (seal + W only) ---------- */
(() => {
  const kinds = ['seal','wiki','seal','seal','wiki'];
  const rows = [];
  for(let r = 0; r < CONFIG.rows; r++){
    let html = '';
    for(let i = 0; i < CONFIG.tilesPerRow; i++){
      const k = kinds[(i + r * 2) % kinds.length];
      html += `<div class="tile ${k}"><svg><use href="#i-${k}"/></svg></div>`;
    }
    const dir = r % 2 ? 'r' : 'l';
    const dur = 120 + (r * 23) % 80;   // 120–200 s per loop: barely moving
    rows.push(`<div class="row ${dir}" style="--d:${dur}s">${html}${html}</div>`);
  }
  document.getElementById('plane').innerHTML = rows.join('');
})();

</script>
<script src="screen.js" data-theme="dark"></script>
</body>
</html>
