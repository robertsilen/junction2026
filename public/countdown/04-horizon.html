<body>
  <canvas id="bg"></canvas>


<script>

/* ---------- Background: sparse stars + soft horizon line ---------- */
const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
const PATHS = { seal: BRAND.markPath2D(), wiki: new Path2D(ICONS.wiki) };
const BOX = { seal: [205.625, 230.535], wiki: [24, 24] };
const rand = (a, b) => a + Math.random() * (b - a);
let W = 0, H = 0, U = 0, DPR = 1, y0 = 0, stars = [], marks = [];

function layout(){
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight; U = Math.min(W, H);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  y0 = Math.round(H * .64);                      // horizon
  stars = Array.from({length: 70}, () => ({
    x: rand(0, W), y: rand(0, y0 * .95), r: rand(.5, 1.2) * Math.max(1, U / 1000),
    a: rand(.12, .45), sp: rand(.15, .4), ph: rand(0, 6.28),
  }));
  // a handful of background-only Wikipedia W's and seals, kept away from the center text
  marks = Array.from({length: 10}, (_, i) => {
    const side = i % 2 ? 1 : -1;
    return {
      type: (i >> 1) % 2 ? 'wiki' : 'seal',
      x: W / 2 + side * rand(W * .3, W * .46), y: rand(H * .14, y0 * .85),
      size: rand(1.6, 2.4) * U / 100, sp: rand(.12, .25), ph: rand(0, 6.28),
    };
  });
}

let gridOffset = 0, last = performance.now();
function render(now){
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  const t = now / 1000;
  ctx.clearRect(0, 0, W, H);

  // stars: slow twinkle
  ctx.fillStyle = '#fff';
  for(const s of stars){
    ctx.globalAlpha = s.a * (.6 + .4 * Math.sin(t * s.sp + s.ph));
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(.1, s.r), 0, Math.PI * 2); ctx.fill();
  }
  // faint logo-stars (≤15% opacity)
  for(const m of marks){
    ctx.save();
    ctx.translate(m.x, m.y);
    const [bw, bh] = BOX[m.type], k = m.size / bh; ctx.scale(k, k); ctx.translate(-bw / 2, -bh / 2);
    ctx.globalAlpha = .06 + .09 * (.5 + .5 * Math.sin(t * m.sp + m.ph));
    ctx.fillStyle = '#fff';
    ctx.fill(PATHS[m.type], 'evenodd');
    ctx.restore();
  }

  // horizon glow: ultraviolet at center fading to cyan, very soft
  const D = Math.max(1, H - y0), cx = W / 2;
  const hl = ctx.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, 'rgba(61,211,238,0)');
  hl.addColorStop(.25, 'rgba(61,211,238,.35)');
  hl.addColorStop(.5, 'rgba(143,59,252,.9)');
  hl.addColorStop(.75, 'rgba(61,211,238,.35)');
  hl.addColorStop(1, 'rgba(61,211,238,0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = hl; ctx.fillRect(0, y0, W, Math.max(1, U * .0012));
  const gl = ctx.createRadialGradient(cx, y0, 0, cx, y0, Math.max(1, W * .45));
  gl.addColorStop(0, 'rgba(143,59,252,.16)'); gl.addColorStop(1, 'rgba(143,59,252,0)');
  ctx.save(); ctx.translate(0, y0); ctx.scale(1, .18); ctx.translate(0, -y0);
  ctx.fillStyle = gl; ctx.fillRect(0, y0 - W * .45, W, W * .9);
  ctx.restore();

}

function frame(now){
  try { render(now); } catch(e) { /* keep looping even if one frame fails */ }
  requestAnimationFrame(frame);
}
layout();
addEventListener('resize', layout);
requestAnimationFrame(frame);
</script>
